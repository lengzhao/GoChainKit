# Development-only low-difficulty PoW chain. Relative database paths use the process cwd.
root: node
plugins:
  protocol:
    use: protocol/powkv
    config: {chainID: dev}
  backend:
    use: backend/bolt
    config: {path: data/pow-chain.db}
  ledger:
    use: storage/kv
    deps: {protocol: protocol, backend: backend}
  pool:
    use: mempool/memory
    config: {maxTransactions: 1000, maxBytes: 16777216}
    deps: {protocol: protocol}
  base-protocol:
    use: protocol/kv
    config: {chainID: dev}
  base-executor:
    use: executor/kv
    deps: {protocol: base-protocol}
  executor:
    use: executor/powkv
    deps: {protocol: protocol, inner: base-executor}
  selector:
    use: selector/fifo
    deps: {protocol: protocol}
  builder:
    use: builder/basic
    config: {maxTransactionBytes: 1572864}
    deps: {protocol: protocol, ledger: ledger, pool: pool, executor: executor, selector: selector}
  host:
    use: node/coordinator
    deps: {protocol: protocol, ledger: ledger, builder: builder, executor: executor, pool: pool}
  key-secret: {use: secret/env, config: {environment: GOCHAINKIT_KEYSTORE_PASSWORD}}
  keys: {use: keystore/encrypted-file, config: {directory: data/pow-keys}, deps: {secret: key-secret}}
  identity: {use: identity/libp2p, config: {keyID: p2p}, deps: {store: keys}}
  network:
    use: network/libp2p
    config: {listen: [/ip4/127.0.0.1/tcp/19001], seeds: []}
    deps: {protocol: protocol, identity: identity}
  importer:
    use: importer/branch
    deps: {protocol: protocol, ledger: ledger, executor: executor, pool: pool}
  replication:
    use: sync/chain
    config: {interval: 500ms}
    deps: {protocol: protocol, ledger: ledger, pool: pool, network: network, importer: importer}
  consensus:
    use: consensus/pow
    config: {interval: 1s}
    deps: {protocol: protocol, ledger: ledger, builder: builder, importer: importer, replication: replication}
  api-query:
    use: api/query
    deps: {protocol: protocol, ledger: ledger, pool: pool}
  api:
    use: api/http
    config: {listen: '127.0.0.1:8081'}
    deps: {query: api-query, network: network}
  node:
    use: node/default
    config: {shutdownTimeout: 5s}
    deps: {ledger: ledger, host: host, consensus: consensus, resources: [network, api], workers: [api]}
