# Development-only single-node chain. Relative database paths use the process cwd.
root: node
plugins:
  protocol:
    use: protocol/kv
    config: {chainID: dev}
  backend:
    use: backend/bolt
    config: {path: data/chain.db}
  ledger:
    use: storage/kv
    deps: {protocol: protocol, backend: backend}
  pool:
    use: mempool/memory
    config: {maxTransactions: 1000, maxBytes: 16777216}
    deps: {protocol: protocol}
  executor:
    use: executor/kv
    deps: {protocol: protocol}
  selector:
    use: selector/fifo
    deps: {protocol: protocol}
  builder:
    use: builder/basic
    config: {maxTransactionBytes: 1572864}
    deps: {protocol: protocol, ledger: ledger, pool: pool, executor: executor, selector: selector}
  host:
    use: node/coordinator
    deps: {protocol: protocol, ledger: ledger, builder: builder, executor: executor, pool: pool}
  consensus:
    use: consensus/single
    config: {interval: 1s}
  api-query:
    use: api/query
    deps: {protocol: protocol, ledger: ledger, pool: pool}
  api:
    use: api/http
    config: {listen: '127.0.0.1:8080'}
    deps: {query: api-query}
  node:
    use: node/default
    config: {shutdownTimeout: 5s}
    deps: {ledger: ledger, host: host, consensus: consensus, resources: [api], workers: [api]}
